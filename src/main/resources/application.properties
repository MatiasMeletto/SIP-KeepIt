# Google Cloud
google.cloud.project-id=sip-keepit
google.cloud.credentials.location=classpath:google-cloud-key.json

# Application
spring.application.name=keepit
server.port=8080

# H2 Database Configuration - REEMPLAZAR MYSQL COMPLETAMENTE
spring.datasource.url=jdbc:h2:mem:keepitdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

